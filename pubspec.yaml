name: rushly_scanner
description: Rushly Logistics — Scanner mobile app (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  pretty_dio_logger: ^1.4.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0

  go_router: ^14.2.0

  url_launcher: ^6.3.0
  mobile_scanner: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
